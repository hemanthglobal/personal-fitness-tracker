<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>60 Days Tracker</title>
  <meta name="description" content="Personal 60-day strength and muscle building tracker.">
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F3F2EE" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem("fitnessTracker.theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body class="is-bare">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="shell">
    <nav class="nav" aria-label="Main">
      <div class="nav__brand" aria-hidden="true">
        <span class="brand-mark">60</span>
        <span class="nav__brand-text">Days<br>to Fit</span>
      </div>
      <a class="nav__item" href="#/today" data-nav="today">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/></svg>
        <span>Today</span>
      </a>
      <a class="nav__item" href="#/calendar" data-nav="calendar">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span>Calendar</span>
      </a>
      <a class="nav__item" href="#/progress" data-nav="progress">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Progress</span>
      </a>
      <a class="nav__item" href="#/more" data-nav="more">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
        <span>More</span>
      </a>
      <button id="sync-status" class="sync" type="button" hidden></button>
    </nav>

    <main id="main" class="main" tabindex="-1">
      <div id="view" class="view"></div>
    </main>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <dialog id="dialog" class="dialog" aria-labelledby="dialog-title"></dialog>
  <noscript><p class="noscript">This tracker needs JavaScript enabled.</p></noscript>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
